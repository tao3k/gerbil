name: Issue 5 release reproduction

on:
  push:
    branches: [issues/release-matrix]
    paths:
      - 'issues/5/**'
      - '.github/actions/release-gerbil/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproduce:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-26.04, macos-26]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: ./.github/actions/release-gerbil
      - name: Reproduce issue 5
        shell: bash
        run: |
          set -euo pipefail
          gxc -exe -o "$RUNNER_TEMP/control" issues/5/control.ss
          test "$("$RUNNER_TEMP/control")" = control-ok
          for module in env gxpkg; do
            static_input="$GERBIL_PREFIX/lib/static/gerbil__tools__$module"
            test -s "$static_input.scm"
            if test -e "$static_input.o"; then
              echo "ISSUE-5 static object present: $module"
            else
              echo "ISSUE-5 static object absent: $module"
            fi
          done

          log="$RUNNER_TEMP/gxpkg-link.log"
          if gxc -exe -o "$RUNNER_TEMP/probe" issues/5/probe.ss > "$log" 2>&1; then
            test -n "$("$RUNNER_TEMP/probe")"
            echo "ISSUE-5 link failure: not reproduced"
          else
            if ! grep -E 'cannot find|file cannot be open|file not found|No such file' "$log" |
                 grep -E 'gerbil__tools__(env|gxpkg)\.o'; then
              tail -n 80 "$log"
              exit 1
            fi
            echo "ISSUE-5 link failure: reproduced"
          fi
